# Render Blueprint for the Mini Kanban Board.
#
# The service names determine the public URLs used below. If a name is already
# taken in your Render workspace, rename BOTH the service and its matching URL.
version: "1"

services:
  - type: web
    name: kanban-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kanban-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://kanban-web-l0hp.onrender.com

  - type: web
    name: kanban-web
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      # Render passes this as a Docker build ARG, and Next.js embeds it in the
      # browser bundle during `npm run build`.
      - key: NEXT_PUBLIC_API_URL
        value: https://kanban-api.onrender.com/api

databases:
  - name: kanban-db
    plan: free
    region: singapore
